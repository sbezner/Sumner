<svg viewBox="0 0 300 380" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="hg-grid" width="15" height="15" patternUnits="userSpaceOnUse">
              <path d="M15 0 L0 0 L0 15" fill="none" stroke="#e2e5eb" stroke-width="0.4"/>
            </pattern>
            <pattern id="hg-alu" width="2.5" height="2.5" patternUnits="userSpaceOnUse">
              <line x1="0" y1="0" x2="0" y2="2.5" stroke="#8a93a3" stroke-width="0.22" opacity=".7"/>
            </pattern>
            <linearGradient id="hg-steel" x1="0" x2="1">
              <stop offset="0" stop-color="#3a4553"/>
              <stop offset="0.35" stop-color="#7c8695"/>
              <stop offset="0.55" stop-color="#8f99a8"/>
              <stop offset="0.8" stop-color="#5b6473"/>
              <stop offset="1" stop-color="#3a4553"/>
            </linearGradient>
            <linearGradient id="hg-cable" x1="0" x2="1">
              <stop offset="0" stop-color="#5b6473"/>
              <stop offset="0.5" stop-color="#c8cdd6"/>
              <stop offset="1" stop-color="#5b6473"/>
            </linearGradient>
            <pattern id="hg-rubber" width="3" height="3" patternUnits="userSpaceOnUse">
              <circle cx="0.75" cy="0.75" r="0.3" fill="#1c2230" opacity=".5"/>
              <circle cx="2.25" cy="2.25" r="0.3" fill="#1c2230" opacity=".5"/>
            </pattern>
          </defs>

          <!-- Blueprint paper -->
          <rect width="300" height="380" fill="#fbfaf7"/>
          <rect width="300" height="380" fill="url(#hg-grid)"/>
          <rect x="4" y="4" width="292" height="372" fill="none" stroke="#0a0e13" stroke-width="0.8"/>
          <rect x="7" y="7" width="286" height="366" fill="none" stroke="#0a0e13" stroke-width="0.3"/>

          <!-- Ground line + hatching -->
          <line x1="20" y1="342" x2="280" y2="342" stroke="#0a0e13" stroke-width="1.2"/>
          <g stroke="#0a0e13" stroke-width="0.4">
            <line x1="30" y1="342" x2="25" y2="350"/><line x1="45" y1="342" x2="40" y2="350"/>
            <line x1="60" y1="342" x2="55" y2="350"/><line x1="75" y1="342" x2="70" y2="350"/>
            <line x1="90" y1="342" x2="85" y2="350"/><line x1="105" y1="342" x2="100" y2="350"/>
            <line x1="120" y1="342" x2="115" y2="350"/><line x1="135" y1="342" x2="130" y2="350"/>
            <line x1="150" y1="342" x2="145" y2="350"/><line x1="165" y1="342" x2="160" y2="350"/>
            <line x1="180" y1="342" x2="175" y2="350"/><line x1="195" y1="342" x2="190" y2="350"/>
            <line x1="210" y1="342" x2="205" y2="350"/><line x1="225" y1="342" x2="220" y2="350"/>
            <line x1="240" y1="342" x2="235" y2="350"/><line x1="255" y1="342" x2="250" y2="350"/>
            <line x1="270" y1="342" x2="265" y2="350"/>
          </g>

          <!-- Base weldment -->
          <rect x="115" y="328" width="70" height="14" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.7"/>
          <rect x="115" y="328" width="70" height="3" fill="#1c2230" opacity=".4"/>
          <circle cx="120" cy="335" r="1.2" fill="#3a4553" stroke="#0a0e13" stroke-width="0.3"/>
          <circle cx="180" cy="335" r="1.2" fill="#3a4553" stroke="#0a0e13" stroke-width="0.3"/>
          <line x1="150" y1="328" x2="150" y2="342" stroke="#0a0e13" stroke-width="0.4"/>

          <!-- Outriggers deployed -->
          <path d="M 118 338 L 55 342 L 53 340 L 53 344 L 55 342" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.6"/>
          <path d="M 182 338 L 245 342 L 247 340 L 247 344 L 245 342" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.6"/>
          <circle cx="118" cy="339" r="2" fill="#3a4553" stroke="#0a0e13" stroke-width="0.4"/>
          <circle cx="118" cy="339" r="0.6" fill="#0a0e13"/>
          <circle cx="182" cy="339" r="2" fill="#3a4553" stroke="#0a0e13" stroke-width="0.4"/>
          <circle cx="182" cy="339" r="0.6" fill="#0a0e13"/>
          <rect x="49" y="343" width="10" height="3" fill="url(#hg-rubber)" stroke="#0a0e13" stroke-width="0.4"/>
          <rect x="241" y="343" width="10" height="3" fill="url(#hg-rubber)" stroke="#0a0e13" stroke-width="0.4"/>

          <!-- Casters -->
          <g transform="translate(135, 340)">
            <path d="M -4 -1 L -4 1 L 4 1 L 4 -1 L 2 -1 L 2 -0.3 L -2 -0.3 L -2 -1 Z" fill="#3a4553" stroke="#0a0e13" stroke-width="0.4"/>
            <circle cx="0" cy="3" r="3" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.5"/>
            <circle cx="0" cy="3" r="1" fill="#0a0e13"/>
          </g>
          <g transform="translate(165, 340)">
            <path d="M -4 -1 L -4 1 L 4 1 L 4 -1 L 2 -1 L 2 -0.3 L -2 -0.3 L -2 -1 Z" fill="#3a4553" stroke="#0a0e13" stroke-width="0.4"/>
            <circle cx="0" cy="3" r="3" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.5"/>
            <circle cx="0" cy="3" r="1" fill="#0a0e13"/>
          </g>

          <!-- Outer mast -->
          <rect x="138" y="185" width="24" height="143" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.7"/>
          <rect x="138" y="185" width="24" height="143" fill="url(#hg-alu)"/>
          <rect x="148" y="185" width="4" height="143" fill="#1c2230" opacity=".35"/>
          <rect x="138" y="185" width="1.5" height="143" fill="#1c2230" opacity=".35"/>
          <rect x="160.5" y="185" width="1.5" height="143" fill="#1c2230" opacity=".35"/>
          <rect x="134" y="323" width="32" height="5" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.5"/>

          <!-- Middle mast -->
          <rect x="140" y="115" width="20" height="72" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.6"/>
          <rect x="140" y="115" width="20" height="72" fill="url(#hg-alu)"/>
          <rect x="148" y="115" width="4" height="72" fill="#1c2230" opacity=".35"/>
          <!-- Slide pads at joint -->
          <rect x="137" y="182" width="3" height="6" fill="#ffc419" stroke="#0a0e13" stroke-width="0.3"/>
          <rect x="160" y="182" width="3" height="6" fill="#ffc419" stroke="#0a0e13" stroke-width="0.3"/>

          <!-- Inner mast -->
          <rect x="142" y="52" width="16" height="65" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.6"/>
          <rect x="142" y="52" width="16" height="65" fill="url(#hg-alu)"/>
          <rect x="148" y="52" width="4" height="65" fill="#1c2230" opacity=".35"/>
          <rect x="139" y="112" width="3" height="6" fill="#ffc419" stroke="#0a0e13" stroke-width="0.3"/>
          <rect x="158" y="112" width="3" height="6" fill="#ffc419" stroke="#0a0e13" stroke-width="0.3"/>
          <!-- Mast top cap -->
          <path d="M 140 52 L 140 47 Q 140 44 143 44 L 157 44 Q 160 44 160 47 L 160 52 Z" fill="#1c2230" stroke="#0a0e13" stroke-width="0.6"/>

          <!-- Pulley guard housing -->
          <path d="M 128 34 L 128 52 L 172 52 L 172 34 Q 172 30 168 30 L 132 30 Q 128 30 128 34 Z"
                fill="none" stroke="#0a0e13" stroke-width="0.8"/>
          <!-- Sheave -->
          <circle cx="150" cy="40" r="7" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.7"/>
          <ellipse cx="150" cy="40" rx="7" ry="1.5" fill="none" stroke="#0a0e13" stroke-width="0.3"/>
          <circle cx="150" cy="40" r="1.6" fill="#1c2230" stroke="#0a0e13" stroke-width="0.3"/>

          <!-- Cable -->
          <line x1="150" y1="47" x2="150" y2="147" stroke="url(#hg-cable)" stroke-width="1.3"/>
          <circle cx="150" cy="147" r="1.1" fill="#3a4553" stroke="#0a0e13" stroke-width="0.3"/>

          <!-- Carriage + forks -->
          <rect x="138" y="140" width="24" height="26" fill="#3a4553" stroke="#0a0e13" stroke-width="0.7"/>
          <circle cx="141" cy="144" r="1.6" fill="#1c2230" stroke="#0a0e13" stroke-width="0.3"/>
          <circle cx="159" cy="144" r="1.6" fill="#1c2230" stroke="#0a0e13" stroke-width="0.3"/>
          <circle cx="141" cy="162" r="1.6" fill="#1c2230" stroke="#0a0e13" stroke-width="0.3"/>
          <circle cx="159" cy="162" r="1.6" fill="#1c2230" stroke="#0a0e13" stroke-width="0.3"/>
          <!-- Fork crossbar (safety yellow) -->
          <rect x="82" y="152" width="136" height="5" fill="#ffc419" stroke="#0a0e13" stroke-width="0.6"/>
          <rect x="82" y="152" width="5" height="28" fill="#ffc419" stroke="#0a0e13" stroke-width="0.6"/>
          <rect x="213" y="152" width="5" height="28" fill="#ffc419" stroke="#0a0e13" stroke-width="0.6"/>
          <path d="M 87 157 L 87 174 L 93 174 Z" fill="#e5a800" stroke="#0a0e13" stroke-width="0.4"/>
          <path d="M 213 157 L 213 174 L 207 174 Z" fill="#e5a800" stroke="#0a0e13" stroke-width="0.4"/>

          <!-- MX Winch · worm-gear ratchet, cutaway showing drum + pawl + worm gear -->
          <g transform="translate(207,236) scale(1.15)">
            <rect x="-44" y="3" width="8" height="16" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.5"/>
            <circle cx="-40" cy="7" r="0.5" fill="#1c2230"/>
            <circle cx="-40" cy="15" r="0.5" fill="#1c2230"/>
            <rect x="-36" y="-9" width="34" height="30" rx="1.5" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.6"/>
            <circle cx="-33" cy="-6" r="0.5" fill="#1c2230"/>
            <circle cx="-5" cy="-6" r="0.5" fill="#1c2230"/>
            <circle cx="-33" cy="18" r="0.5" fill="#1c2230"/>
            <circle cx="-5" cy="18" r="0.5" fill="#1c2230"/>
            <line x1="-36" y1="6" x2="-2" y2="6" stroke="#0a0e13" stroke-width="0.3" opacity="0.55"/>
            <circle cx="-19" cy="6" r="11" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.55"/>
            <circle cx="-19" cy="6" r="10.2" fill="none" stroke="#0a0e13" stroke-width="0.2" opacity="0.55"/>
            <g fill="none" stroke="#0a0e13" stroke-width="0.28" opacity="0.7">
              <circle cx="-19" cy="6" r="5"/><circle cx="-19" cy="6" r="6"/>
              <circle cx="-19" cy="6" r="7"/><circle cx="-19" cy="6" r="8"/>
              <circle cx="-19" cy="6" r="9"/>
            </g>
            <circle cx="-19" cy="6" r="1.3" fill="#0a0e13"/>
            <line x1="-19" y1="-5" x2="-19" y2="-14" stroke="url(#hg-cable)" stroke-width="1"/>
            <circle cx="-19" cy="-14" r="0.8" fill="#3a4553" stroke="#0a0e13" stroke-width="0.3"/>
            <g fill="#1c2230" stroke="#0a0e13" stroke-width="0.2">
              <path d="M -19.9 -4.8 l 1 -0.9 l 0.9 0.9 z"/>
              <path d="M -14.5 -3.7 l 0.9 -0.7 l 0.5 1 z"/>
              <path d="M -23.5 -3.7 l -0.5 1 l -0.9 -0.7 z"/>
              <path d="M -10.5 -1.6 l 0.8 -0.5 l 0.3 1 z"/>
              <path d="M -27.5 -1.6 l -0.3 1 l -0.8 -0.5 z"/>
            </g>
            <circle cx="-7" cy="-7" r="1.1" fill="#3a4553" stroke="#0a0e13" stroke-width="0.4"/>
            <circle cx="-7" cy="-7" r="0.35" fill="#0a0e13"/>
            <path d="M -7 -7 L -13.5 -3 L -12.2 -1.8 L -6 -5.8 Z" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.4"/>
            <path d="M -5.5 -7.3 q 1.2 -1.4 2.5 -0.8 q 1.3 0.6 0.3 1.9 q -1 1.2 -2.4 0.5" fill="none" stroke="#0a0e13" stroke-width="0.4"/>
            <circle cx="-2.7" cy="-5.2" r="0.5" fill="#3a4553" stroke="#0a0e13" stroke-width="0.25"/>
            <rect x="-5" y="12" width="10" height="7" fill="url(#hg-steel)" stroke="#0a0e13" stroke-width="0.4"/>
            <g stroke="#0a0e13" stroke-width="0.3">
              <line x1="-5" y1="18.5" x2="-2" y2="12"/><line x1="-3.4" y1="19" x2="0" y2="12"/>
              <line x1="-1.8" y1="19" x2="2" y2="12"/><line x1="-0.2" y1="19" x2="3.6" y2="12"/>
              <line x1="1.4" y1="19" x2="5" y2="12.4"/><line x1="3" y1="19" x2="5" y2="14.6"/>
            </g>
            <rect x="5" y="14.5" width="4" height="2" fill="#3a4553" stroke="#0a0e13" stroke-width="0.3"/>
            <line x1="9" y1="15.5" x2="14" y2="15.5" stroke="#0a0e13" stroke-width="1"/>
            <line x1="14" y1="15.5" x2="18" y2="8" stroke="#0a0e13" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="18" cy="8" r="2.2" fill="#ffc419" stroke="#0a0e13" stroke-width="0.5"/>
          </g>

          <!-- Dimension line (left) -->
          <g stroke="#0e7461" stroke-width="0.5" fill="#0e7461">
            <line x1="138" y1="44" x2="30" y2="44" stroke-dasharray="1.5,1.5"/>
            <line x1="115" y1="342" x2="30" y2="342" stroke-dasharray="1.5,1.5"/>
            <line x1="34" y1="44" x2="34" y2="342"/>
            <path d="M 34 44 L 32 49 L 36 49 Z"/>
            <path d="M 34 342 L 32 337 L 36 337 Z"/>
            <text x="24" y="196" font-family="ui-monospace, monospace" font-size="6.5" font-weight="600" text-anchor="middle" fill="#0e7461" transform="rotate(-90 24 196)">18′-4⅜″ MAX</text>
          </g>

          <!-- Callout balloons w/ leader lines -->
          <g font-family="ui-monospace, monospace" font-size="7" font-weight="700" text-anchor="middle">
            <!-- 1 · Sheave -->
            <line x1="150" y1="40" x2="220" y2="30" stroke="#0e7461" stroke-width="0.5"/>
            <circle cx="222" cy="28" r="7" fill="#fbfaf7" stroke="#0e7461" stroke-width="1"/>
            <text x="222" y="30.5" fill="#0e7461">1</text>
            <!-- 2 · Fork -->
            <line x1="82" y1="155" x2="45" y2="140" stroke="#0e7461" stroke-width="0.5"/>
            <circle cx="42" cy="138" r="7" fill="#fbfaf7" stroke="#0e7461" stroke-width="1"/>
            <text x="42" y="140.5" fill="#0e7461">2</text>
            <!-- 3 · Winch (points to worm gear on crank shaft) -->
            <line x1="228" y1="245" x2="258" y2="256" stroke="#0e7461" stroke-width="0.5"/>
            <circle cx="261" cy="258" r="7" fill="#fbfaf7" stroke="#0e7461" stroke-width="1"/>
            <text x="261" y="260.5" fill="#0e7461">3</text>
            <!-- 4 · Slide pads -->
            <line x1="140" y1="184" x2="82" y2="212" stroke="#0e7461" stroke-width="0.5"/>
            <circle cx="79" cy="214" r="7" fill="#fbfaf7" stroke="#0e7461" stroke-width="1"/>
            <text x="79" y="216.5" fill="#0e7461">4</text>
            <!-- 5 · Outrigger -->
            <line x1="118" y1="339" x2="82" y2="320" stroke="#0e7461" stroke-width="0.5"/>
            <circle cx="79" cy="318" r="7" fill="#fbfaf7" stroke="#0e7461" stroke-width="1"/>
            <text x="79" y="320.5" fill="#0e7461">5</text>
          </g>

          <!-- Title block -->
          <g>
            <line x1="180" y1="358" x2="292" y2="358" stroke="#0a0e13" stroke-width="0.4"/>
            <text x="184" y="366" font-family="ui-monospace, monospace" font-size="6" font-weight="700" fill="#0a0e13" letter-spacing="0.4">SUMNER 2118 · CONTRACTOR LIFT</text>
            <text x="184" y="373" font-family="ui-monospace, monospace" font-size="5" fill="#5b6473" letter-spacing="0.4">FIG. 01 · FRONT ELEVATION · N.T.S.</text>
          </g>
        </svg>